<div id="plans-root">
<style>
#plans-root .plans-stage{position:relative;width:100%;aspect-ratio:16/10;min-height:240px;max-height:520px;overflow:hidden}
#plans-root .plans-stage canvas{display:block;width:100%;height:100%;touch-action:none}
#plans-root .plans-tip{position:absolute;left:0;top:0;transform:translate(-50%,-135%);pointer-events:none;background:var(--popover);color:var(--popover-foreground);padding:3px 9px;border-radius:6px;font-size:12px;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .12s ease;z-index:3}
#plans-root .plans-tip em{font-style:normal;color:var(--muted-foreground);margin-left:6px}
#plans-root .plans-stack{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#plans-root .plans-legend{margin:0}
</style>
<div class="plans-stage" id="plans-stage">
<canvas id="plans-canvas" role="img" aria-label="公寓楼层分解模型：一层大堂、宴会厅、图书室、医务室、厨房储藏、放映厅、健身房泳池与客房层的分体平面"></canvas>
<div class="plans-tip" id="plans-tip" aria-hidden="true"></div>
</div>
<div class="plans-stack">
<div class="viz-controls" role="group" aria-label="楼层">
<button class="btn btn-primary" type="button" data-plans-floor="-1" aria-pressed="true">全部楼层</button>
<button class="btn" type="button" data-plans-floor="0" aria-pressed="false">1F 大堂</button>
<button class="btn" type="button" data-plans-floor="1" aria-pressed="false">2F 宴会厅</button>
<button class="btn" type="button" data-plans-floor="2" aria-pressed="false">3F 图书室</button>
<button class="btn" type="button" data-plans-floor="3" aria-pressed="false">4F 医务室</button>
<button class="btn" type="button" data-plans-floor="4" aria-pressed="false">5F 厨房</button>
<button class="btn" type="button" data-plans-floor="5" aria-pressed="false">6F 放映厅</button>
<button class="btn" type="button" data-plans-floor="6" aria-pressed="false">7F 健身泳池</button>
<button class="btn" type="button" data-plans-floor="7" aria-pressed="false">12F 客房层</button>
</div>
<div class="viz-controls" role="group" aria-label="显示">
<button class="btn" type="button" data-plans-toggle="props" aria-pressed="true">家具陈设</button>
<button class="btn" type="button" data-plans-toggle="labels" aria-pressed="true">楼层标签</button>
<button class="btn" type="button" data-plans-toggle="grid" aria-pressed="true">地面网格</button>
<button class="btn" type="button" data-plans-toggle="spin" aria-pressed="false">自动旋转</button>
</div>
<p class="text-small text-muted plans-legend" id="plans-legend">八块楼板均为示意布局，尺寸统一缩小、不按等比。点楼层按钮或直接点楼板，即可把那一层单独抽出来看。</p>
<p class="sr-only" id="plans-desc">公寓内部按层拆开的示意模型。一层大堂前厅，二层宴会厅餐厅，三层图书室，四层医务室与观察室，五层厨房与冷库储藏，六层放映厅与游戏室，七层健身房与泳池，十二层为代表客房层，环廊两侧各一套客房并带挑出外立面的露台。每层都是方形环板，中央留出贯通全楼的中庭。</p>
</div>
