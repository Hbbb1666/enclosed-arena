<div id="arena-root">
<style>
#arena-root .arena-stage{position:relative;width:100%;aspect-ratio:16/10;min-height:240px;max-height:520px;overflow:hidden}
#arena-root .arena-stage canvas{display:block;width:100%;height:100%;touch-action:none}
#arena-root .arena-tip{position:absolute;left:0;top:0;transform:translate(-50%,-135%);pointer-events:none;background:var(--popover);color:var(--popover-foreground);padding:2px 8px;border-radius:6px;font-size:12px;line-height:1.45;white-space:nowrap;opacity:0;transition:opacity .12s ease;z-index:3}
#arena-root .arena-tip em{font-style:normal;color:var(--muted-foreground);margin-left:6px}
#arena-root .arena-stack{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#arena-root .arena-legend{margin:0}
</style>
<div class="arena-stage" id="arena-stage">
<canvas id="arena-canvas" role="img" aria-label="可旋转查看的禁闭空间三维模型：直径一千米的圆形边界、居中的十四层公寓、外场花园与广场"></canvas>
<div class="arena-tip" id="arena-tip" aria-hidden="true"></div>
</div>
<div class="arena-stack">
<div class="viz-controls" role="group" aria-label="视角预设">
<button class="btn btn-primary" type="button" data-arena-view="overview" aria-pressed="true">全景</button>
<button class="btn" type="button" data-arena-view="top" aria-pressed="false">俯瞰</button>
<button class="btn" type="button" data-arena-view="floors" aria-pressed="false">楼层剖面</button>
<button class="btn" type="button" data-arena-view="court" aria-pressed="false">中庭</button>
<button class="btn" type="button" data-arena-view="grounds" aria-pressed="false">外场</button>
</div>
<div class="viz-controls" role="group" aria-label="显示图层">
<button class="btn" type="button" data-arena-toggle="barrier" aria-pressed="true">边界屏障</button>
<button class="btn" type="button" data-arena-toggle="facade" aria-pressed="true">公寓外墙</button>
<button class="btn" type="button" data-arena-toggle="roof" aria-pressed="true">屋顶</button>
<button class="btn" type="button" data-arena-toggle="garden" aria-pressed="true">花园</button>
<button class="btn" type="button" data-arena-toggle="plaza" aria-pressed="true">广场</button>
<button class="btn" type="button" data-arena-toggle="night" aria-pressed="false">夜间</button>
<button class="btn" type="button" data-arena-toggle="spin" aria-pressed="false">自动旋转</button>
</div>
<div class="viz-controls">
<label class="form-label" for="arena-explode">楼层展开 <span class="text-muted" id="arena-explode-out">0 米</span></label>
<input class="form-range" id="arena-explode" type="range" min="0" max="100" step="1" value="0" />
</div>
<p class="text-small text-muted arena-legend" id="arena-room-label">房间分配（点名字展开该层）</p>
<div class="viz-controls" role="group" aria-label="房间分配">
<button class="btn" type="button" data-arena-room="801" aria-pressed="false">801 沈砚</button>
<button class="btn" type="button" data-arena-room="802" aria-pressed="false">802 秦无咎</button>
<button class="btn" type="button" data-arena-room="901" aria-pressed="false">901 姜晚</button>
<button class="btn" type="button" data-arena-room="902" aria-pressed="false">902 苏半夏</button>
<button class="btn" type="button" data-arena-room="1001" aria-pressed="false">1001 陆知遥</button>
<button class="btn" type="button" data-arena-room="1002" aria-pressed="false">1002 谢惊蛰</button>
<button class="btn" type="button" data-arena-room="1101" aria-pressed="false">1101 顾青梧</button>
<button class="btn" type="button" data-arena-room="1102" aria-pressed="false">1102 宁不疑</button>
<button class="btn" type="button" data-arena-room="1201" aria-pressed="false">1201 薇拉·索恩</button>
<button class="btn" type="button" data-arena-room="1202" aria-pressed="false">1202 伊芙琳·布莱克</button>

</div>
<p class="text-small text-muted arena-legend" id="arena-legend">空间直径 1 000 米 · 公寓 650 × 650 米（含 170 × 170 米中庭，占地约 50%）· 地上 14 层，8–14 层为 14 间客房 · 外场环带最宽 175 米</p>
<p class="sr-only" id="arena-desc">圆形禁闭空间，直径一千米，边界为不可毁的透明屏障。中心是占地约百分之五十的方形合院公寓，地上十四层，中庭贯穿全楼。一层大堂、二层宴会厅、三层图书室、四层医务室、五层厨房储藏、六层放映厅、七层健身房泳池为公共层；八至十四层每层两间客房，共十四间，分别住着十四名参赛者。外场沿四边分布喷泉广场与西式规整花园，外圈为环形散步道。</p>
</div>

if (syncSlider) explodeEl.value = String(Math.round(explode * 100));
facadeGroup.visible = state.facade && explode <= 0.01;
}
function setNight(on) {
skyMat.map = on ? skyNight : skyDay;
skyMat.needsUpdate = true;
stars.material.opacity = on ? 0.85 : 0;
hemi.intensity = on ? 0.32 : 0.85;
hemi.color.set(on ? 0x2a3550 : 0xdfe9f5);
sun.intensity = on ? 0.22 : 1.15;
fill.intensity = on ? 0.12 : 0.28;
gateLight.intensity = on ? 0.9 : 0;
MAT.lampGlow.emissiveIntensity = on ? 1.5 : 0.32;
MAT.barrier.emissiveIntensity = on ? 1.6 : 0.75;
MAT.barrierLine.opacity = on ? 0.5 : 0.34;
MAT.water.emissiveIntensity = on ? 1.1 : 0.5;
facadeMats.forEach(function (item) { item.mat.emissiveIntensity = on ? 1.15 : 0; });
var fogColor = on ? new THREE.Color(0x0b1018) : new THREE.Color(THEME.bg).offsetHSL(0, 0, -0.05);
scene.fog = new THREE.Fog(fogColor, 1500, 4300);
}
function applyLayers() {
barrierGroup.visible = state.barrier;
gardenGroup.visible = state.garden;
plazaGroup.visible = state.plaza;
roofGroup.visible = state.roof;
facadeGroup.visible = state.facade && explode <= 0.01;
setNight(state.night);
controls.autoRotate = state.spin && !reduceMotion;
}
var viewButtons = root.querySelectorAll('[data-arena-view]');
Array.prototype.forEach.call(viewButtons, function (btn) {
btn.addEventListener('click', function () {
Array.prototype.forEach.call(viewButtons, function (b) {
var on = b === btn;
b.classList.toggle('btn-primary', on);
b.setAttribute('aria-pressed', on ? 'true' : 'false');
});
flyTo(btn.getAttribute('data-arena-view'));
});
});
var toggleButtons = root.querySelectorAll('[data-arena-toggle]');
Array.prototype.forEach.call(toggleButtons, function (btn) {
btn.addEventListener('click', function () {
var key = btn.getAttribute('data-arena-toggle');
state[key] = !state[key];
btn.setAttribute('aria-pressed', state[key] ? 'true' : 'false');
if (key === 'spin' && controls.autoRotate !== undefined) controls.autoRotateSpeed = 0.65;
applyLayers();
});
});
explodeEl.addEventListener('input', function () {
setExplode(Number(explodeEl.value) / 100, false);
});
var selectedFloor = null;
var roomButtons = root.querySelectorAll('[data-arena-room]');
function paintFloors() {
floorsGroup.children.forEach(function (level) {
var plate = level.children[0];
if (plate) plate.material = plate.userData.floor === selectedFloor ? MAT.highlight : MAT.floorPlate;
});
}
function focusRoom(room) {
var suite = null;
for (var i = 0; i < SUITES.length; i++) if (SUITES[i].room === room) suite = SUITES[i];
if (!suite) return;
if (explode < 0.35) setExplode(0.42, true);
selectedFloor = suite.floor;
setHover(null);
paintFloors();
var lift = (suite.floor - 1) * explode * GAP_MAX;
var y = floorY(suite.floor) + lift;
flyToPoint([580, y + 150, 800], [0, y + 5, 0], 850);
}
Array.prototype.forEach.call(roomButtons, function (btn) {
btn.addEventListener('click', function () {
Array.prototype.forEach.call(roomButtons, function (b) {
b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
});
focusRoom(btn.getAttribute('data-arena-room'));
});
});
var raycaster = new THREE.Raycaster();
var pointer = new THREE.Vector2();
var hovered = null;
function setHover(mesh) {
if (hovered === mesh) return;
if (hovered) hovered.material = hovered.userData.floor === selectedFloor ? MAT.highlight : MAT.floorPlate;
hovered = mesh;
if (hovered) hovered.material = MAT.stoneLight;
}
canvas.addEventListener('pointerdown', function () { tween = null; });
canvas.addEventListener('pointermove', function (e) {
var rect = canvas.getBoundingClientRect();
pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
raycaster.setFromCamera(pointer, camera);
var targets = explode > 0.01 ? floorMeshes : floorMeshes.concat(facadeWalls);
var hits = raycaster.intersectObjects(targets, false);
var mesh = hits.length ? hits[0].object : null;
if (mesh && mesh.userData && mesh.userData.floor) {
var f = mesh.userData.floor;
setHover(mesh);
var roomLine = suitesOnFloor(f).length ? ' · ' + suitesText(f) : '';
tipEl.textContent = '第 ' + f + ' 层 · ' + FLOOR_NAMES[f - 1] + roomLine + '（层高 ' + (f === 1 ? GROUND_H : FLOOR_H) + ' 米）';
tipEl.style.left = (e.clientX - rect.left) + 'px';
tipEl.style.top = (e.clientY - rect.top) + 'px';
tipEl.style.opacity = '1';
} else {
setHover(null);
tipEl.style.opacity = '0';
}
});
canvas.addEventListener('pointerleave', function () {
setHover(null);
tipEl.style.opacity = '0';
});
function resize() {
var w = stage.clientWidth || 640;
var h = stage.clientHeight || Math.round(w * 0.625);
renderer.setSize(w, h, false);
camera.aspect = w / h;
camera.updateProjectionMatrix();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
else window.addEventListener('resize', resize);
resize();
var last = performance.now();
function frame(now) {
last = now;
if (tween) {
var k = Math.min(1, (now - tween.t0) / tween.ms);
var e = ease(k);
camera.position.lerpVectors(tween.fromPos, tween.toPos, e);
controls.target.lerpVectors(tween.fromTarget, tween.toTarget, e);
if (k >= 1) tween = null;
}
controls.update();
renderer.render(scene, camera);
requestAnimationFrame(frame);
}
applyLayers();
setExplode(0, true);
requestAnimationFrame(frame);
})();
</script>
</div>
